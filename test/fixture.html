<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>拾取测试页</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f6f7f9; }
    #app { padding: 40px; }
    .list { display: flex; gap: 12px; }
    .btn { padding: 10px 18px; border-radius: 8px; border: 1px solid #d0d5dd; background: #fff; }
    .btn.primary { background: #4056ff; color: #fff; border-color: #2b3cf0; }
    .tags { margin-top: 420px; display: flex; gap: 8px; }
    .card { margin-top: 24px; padding: 20px; border-radius: 12px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  </style>
</head>
<body>
  <div id="app">
    <h1 class="title">订单列表</h1>
    <div class="list">
      <button class="btn" id="first">返回</button>
      <button class="btn primary" id="target" data-testid="submit">提交订单</button>
    </div>
    <section class="card">
      <p class="text">总计 <strong>¥128.00</strong></p>
      <div class="tags"><span>新</span><span class="hot">加急</span></div>
    </section>
    <div class="react-row" style="margin-top: 24px; display: flex; gap: 8px;">
      <button class="_btn_9x2k1" data-testid="reanalyze" aria-label="重新分析">重新分析</button>
      <span class="_label_4f8c">已完成</span>
    </div>
    <div class="flex items-center gap-2" style="margin-top: 12px; height: 24px;"></div>
    <div class="order-card flex p-4" style="margin-top: 12px; height: 24px;"></div>
    <div id="source-only" style="margin-top: 12px; height: 16px;"></div>
    <div id="absolute-source" style="margin-top: 12px; height: 16px;"></div>
    <div id="minified-name" style="margin-top: 12px; height: 16px;"></div>
    <div id="stack-source" style="margin-top: 12px; height: 16px;"></div>
  </div>
  <script>
    window.__pageClicks = 0;
    document.addEventListener('click', () => { window.__pageClicks += 1; });

    // Hand-written React fibers: enough shape for the guest to walk (type, return,
    // _debugSource) without pulling React into the test suite.
    (function () {
      const root = { type: null, return: null, _debugSource: null };
      function App() {}
      function Toolbar() {}
      function Ab() {}
      const app = { type: App, return: root };
      const toolbar = {
        type: Toolbar,
        return: app,
        _debugSource: { fileName: 'webpack-internal:///./src/components/Toolbar.tsx', lineNumber: 42, columnNumber: 7 },
      };
      const button = {
        type: 'button',
        return: toolbar,
        _debugSource: { fileName: 'webpack-internal:///./src/components/Toolbar.tsx', lineNumber: 42, columnNumber: 7 },
      };
      document.querySelector('[data-testid="reanalyze"]').__reactFiber$test = button;

      const orphan = {
        type: 'div',
        return: root,
        _debugSource: { fileName: 'vite:///src/pages/Dashboard.vue', lineNumber: 8, columnNumber: 1 },
      };
      document.querySelector('#source-only').__reactFiber$test = orphan;

      const minified = { type: Ab, return: root, _debugSource: { fileName: './src/widgets/Chart.jsx', lineNumber: 5 } };
      document.querySelector('#minified-name').__reactFiber$test = { type: 'div', return: minified };

      // React 19 dropped _debugSource; the owner stack still names the JSX site.
      function ToolbarCard() {}
      const stacked = {
        type: 'div',
        return: { type: ToolbarCard, return: root },
        _debugStack: {
          stack: [
            'Error: react-stack-top-frame',
            '    at exports.jsxDEV (http://127.0.0.1:5199/node_modules/.vite/deps/react_jsx-dev-runtime.js?v=1:196:25)',
            '    at ToolbarCard (http://127.0.0.1:5199/src/components/Toolbar.jsx:9:30)',
          ].join('\n'),
        },
      };
      document.querySelector('#stack-source').__reactFiber$test = stacked;

      // Vite hands back absolute paths for _debugSource; they must land as src-relative.
      function ReportPanel() {}
      const absolute = {
        type: 'div',
        _debugSource: { fileName: '/private/tmp/app/src/panels/ReportPanel.tsx', lineNumber: 12, columnNumber: 5 },
        return: { type: ReportPanel, return: root },
      };
      document.querySelector('#absolute-source').__reactFiber$test = absolute;
    })();
  </script>
</body>
</html>
