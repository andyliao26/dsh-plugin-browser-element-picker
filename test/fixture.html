  <div id="app">

    <div class="react-row" style="margin-top: 24px; display: flex; gap: 8px;">
      <button class="_btn_9x2k1" data-testid="reanalyze" aria-label="重新分析">重新分析</button>
      <span class="_label_4f8c">已完成</span>
    </div>
    <div class="flex items-center gap-2" style="margin-top: 12px; height: 24px;"></div>

    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
      <strong>环境维护</strong>
      <button type="button" id="sheet-close" aria-label="关闭">&times;</button>
    </div>
    <fieldset id="sheet-fieldset" style="border: 1px solid #e4e7ec; border-radius: 8px; padding: 12px;">
      <legend>目标 1</legend>
      <label style="display: block; margin-bottom: 8px;">目标 1 名称 <input id="sheet-target-name" value="uat-223"></label>
      <label style="display: block; margin-bottom: 8px;">目标 1 主机 <input id="sheet-host" value="192.168.3.223"></label>
      <button type="button" id="sheet-add">添加目标</button>
    </fieldset>
  </div>
  <script>
    window.__pageClicks = 0;
    document.addEventListener('click', () => { window.__pageClicks += 1; });

    // A page-level sheet that plays by the rules a real drawer does: focus guards
    // that only accept their own container, and mousedown dismissal registered on
    // window capture at load time - before the annotation bundle is injected.
    window.__sheet = (function () {
      const sheet = document.getElementById('sheet');
      const first = document.getElementById('sheet-target-name');
      let guardTimer = null;
      let thief = null;
      const steal = (event) => {
        if (sheet.hidden || sheet.contains(event.target)) return;
        first.focus();
      };
      const recheck = (event) => {
        if (sheet.hidden || (event.relatedTarget && sheet.contains(event.relatedTarget))) return;
        clearTimeout(guardTimer);
        guardTimer = setTimeout(() => {
          if (sheet.hidden || sheet.contains(document.activeElement)) return;
          first.focus();
        }, 40);
      };
      const dismiss = (event) => {
        if (sheet.hidden || sheet.contains(event.target)) return;
        sheet.hidden = true;
      };
      document.addEventListener('focusin', steal, true);
      document.addEventListener('focusout', recheck, true);
      window.addEventListener('mousedown', dismiss, true);
      document.addEventListener('mousedown', dismiss);
      const walkUp = (node) => {
        for (let cursor = node; cursor; cursor = cursor.parentNode) if (cursor === sheet) return true;
        return false;
      };
      // Other ways a real drawer decides "outside", none of which go through contains:
      // composedPath on the bubble phase, composedPath on the capture phase, parentNode walking.
      document.addEventListener('mousedown', (event) => {
        if (sheet.hidden || event.composedPath().indexOf(sheet) >= 0) return;
        sheet.hidden = true;
      });
      document.addEventListener('mousedown', (event) => {
        if (sheet.hidden || event.composedPath().indexOf(sheet) >= 0) return;
        sheet.hidden = true;
      }, true);
      document.addEventListener('mousedown', (event) => {
        if (sheet.hidden || walkUp(event.target)) return;
        sheet.hidden = true;
      });
      document.getElementById('sheet-close').addEventListener('click', () => { sheet.hidden = true; });
      return {
        open() { sheet.hidden = false; first.focus(); return sheet.hidden; },
        close() { sheet.hidden = true; clearTimeout(guardTimer); return sheet.hidden; },
        // Bypasses containment: steals once, or forever, regardless of what holds focus.
        stealOnceLater(ms) { setTimeout(() => first.focus(), ms); return true; },
        startThief() { first.focus(); thief = setInterval(() => first.focus(), 40); return true; },
        stopThief() { clearInterval(thief); thief = null; return true; },
      };
    })();

    // _debugSource) without pulling React into the test suite.

      const orphan = {

        return: root,
        _debugSource: { fileName: 'vite:///src/pages/Dashboard.vue', lineNumber: 8, columnNumber: 1 },
      };

      document.querySelector('#minified-name').__reactFiber$test = { type: 'div', return: minified };

      function ToolbarCard() {}
      const stacked = {
        type: 'div',
        return: { type: ToolbarCard, return: root },
        _debugStack: {
          stack: [
            'Error: react-stack-top-frame',
            '    at exports.jsxDEV (http://127.0.0.1:5199/node_modules/.vite/deps/react_jsx-dev-runtime.js?v=1:196:25)',
            '    at ToolbarCard (http://127.0.0.1:5199/src/components/Toolbar.jsx:9:30)',
          ].join('\n'),
        },
      };
      document.querySelector('#stack-source').__reactFiber$test = stacked;

      // Vite hands back absolute paths for _debugSource; they must land as src-relative.
      function ReportPanel() {}
      const absolute = {
